name: Temporary Lockfile Repair

on:
  push:
    branches:
      - chatgpt/resend-delivery-webhooks

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/resend-delivery-webhooks

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Regenerate package lock only
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Commit lockfile repair
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already synchronized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Repair npm lockfile"
          git push origin HEAD:chatgpt/resend-delivery-webhooks
