name: GitHub Actions lockfile pilot (temporary)

on:
  pull_request:
    paths:
      - ".github/workflows/actions-lockfile-pilot.yml"

permissions:
  contents: read

jobs:
  generate:
    name: Generate and verify (read-only repo)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Generate scoped lockfile using GitHub's official CLI extension
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh extension install github/gh-actions-lock
          gh actions-lock .github/workflows/ci.yml
          gh actions-lock --verify
          test -s .github/workflows/actions.lock
          echo '=== GENERATED LOCKFILE START ==='
          cat .github/workflows/actions.lock
          echo '=== GENERATED LOCKFILE END ==='
          echo '=== WORKFLOW DIFF START ==='
          git diff -- .github/workflows/ci.yml
          echo '=== WORKFLOW DIFF END ==='
