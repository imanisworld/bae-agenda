[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bae-media-curator"
version = "0.1.0"
description = "Local-only, read-only DJ media review workbench"
requires-python = ">=3.11"
dependencies = ["Pillow>=12.0,<13"]

[project.optional-dependencies]
heif = ["pillow-heif>=1.0,<2"]
dev = ["ruff>=0.12,<1"]

[project.scripts]
media-curator = "media_curator.cli:main"

[tool.setuptools.packages.find]
include = ["media_curator*"]

[tool.ruff]
line-length = 110


[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
